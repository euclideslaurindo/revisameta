# RevisaMeta - full stack.
#   docker compose up -d                    -> everything (COMPOSE_PROFILES=full in .env)
#   docker compose --profile lite up -d     -> lighter: 1 R process
#   docker compose --profile test run --rm backend-test   -> backend tests
#
# Postgres, Redis, storage and the stats service are never published to the host.

name: revisameta

x-backend-env: &backend-env
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
    STATS_R_URL: http://caddy:8001
    SMTP_HOST: mailpit
    S3_ENDPOINT: http://storage:9000

services:
  # Serves the Angular build and proxies the API, storage and R (Caddyfile).
  caddy:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    environment:
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge, internal]

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal, edge]  # edge: outbound access (Turnstile, SMTP)

  # Background jobs (PDF processing, imports, exports). See ADR-005.
  worker:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    <<: *backend-env
    command: ["arq", "app.workers.main.WorkerSettings"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  stats-r:
    build:
      context: ./stats-r
      target: runtime
    restart: unless-stopped
    healthcheck: &stats-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [internal]

  # Second R process, balanced by Caddy (internal port 8001). Not started in "lite".
  stats-r-2:
    build:
      context: ./stats-r
      target: runtime
    restart: unless-stopped
    healthcheck: *stats-health
    profiles: [full]
    networks: [internal]

  postgres:
    image: postgres:16.16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  # S3-compatible file storage (RustFS replaces MinIO, see ADR-004).
  storage:
    image: rustfs/rustfs:1.0.5
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - storage_data:/data
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  # Development inbox for verification and invitation e-mails: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    networks: [internal, edge]

  # ---- Tests (profile "test"): isolated database and Redis --------------------
  postgres-test:
    image: postgres:16.16-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: revisameta_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d revisameta_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]

  redis-test:
    image: redis:8.8.4-alpine
    profiles: [test]
    networks: [internal]

  storage-test:
    image: rustfs/rustfs:1.0.5
    profiles: [test]
    environment:
      RUSTFS_ACCESS_KEY: test-access
      RUSTFS_SECRET_KEY: test-secret-key
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    tmpfs: ["/data:mode=1777"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]

  backend-test:
    build:
      context: ./backend
      target: dev
    profiles: [test]
    environment:
      APP_ENV: test
      POSTGRES_HOST: postgres-test
      POSTGRES_DB: revisameta_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      REDIS_URL: redis://redis-test:6379/0
      JWT_SECRET: test-secret-not-for-production-use-0123456789
      STATS_R_URL: http://stats-r:8000
      S3_ENDPOINT: http://storage-test:9000
      S3_PUBLIC_ENDPOINT: http://storage-test:9000
      S3_ACCESS_KEY: test-access
      S3_SECRET_KEY: test-secret-key
      S3_BUCKET: test-files
      UPLOAD_PART_SIZE_MB: "5"
    depends_on:
      storage-test:
        condition: service_healthy
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_started
    command: ["pytest"]
    networks: [internal]

networks:
  edge: {}
  internal:
    internal: true

volumes:
  postgres_data: {}
  redis_data: {}
  storage_data: {}
  caddy_data: {}
